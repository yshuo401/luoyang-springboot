spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.100.128}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:luoyang_tourism}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
  data:
    redis:
      host: ${REDIS_HOST:192.168.100.128}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

app:
  oss:
    enabled: true
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
  wechat:
    mock-enabled: ${WECHAT_MOCK_ENABLED:true}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    nickname: ${BOOTSTRAP_ADMIN_NICKNAME:系统管理员}

logging:
  level:
    com.luoyang.tourism: DEBUG
